<header class="dept-hero wrap">
  <div class="dept-eyebrow" style="color:#5A5447">03 &nbsp;/&nbsp; Department</div>
  <h1>Pictures</h1>
  <p>Photographs, with captions that try slightly too hard.</p>
</header>

<section class="mosaic wrap" style="margin-top:16px;">
  <figure style="grid-column:1/6;grid-row:span 5;background:#3B342B;">
    <figcaption class="on-dark"><span class="pl">PL. 01</span><div class="cap">Morning light, [location].</div></figcaption>
  </figure>
  <figure style="grid-column:6/10;grid-row:span 2;background:#8A8676;">
    <figcaption class="on-light"><span class="pl">PL. 02</span><div class="cap">Desk, 6:12 a.m.</div></figcaption>
  </figure>
  <figure style="grid-column:10/13;grid-row:span 3;background:#2A2F3A;">
    <figcaption class="on-dark"><span class="pl">PL. 03</span><div class="cap">[Subject], mid-motion.</div></figcaption>
  </figure>
  <figure style="grid-column:6/10;grid-row:span 3;background:#CDB98E;">
    <figcaption class="on-light"><span class="pl">PL. 04</span><div class="cap">Piano, unattended.</div></figcaption>
  </figure>
  <figure style="grid-column:10/13;grid-row:span 2;background:#B02A14;">
    <figcaption class="on-dark"><span class="pl">PL. 05</span><div class="cap">Fog. Nobody’s fault.</div></figcaption>
  </figure>
  <figure style="grid-column:1/6;grid-row:span 2;background:#6B5B47;">
    <figcaption class="on-dark"><span class="pl">PL. 06</span><div class="cap">[Caption.]</div></figcaption>
  </figure>
  <figure style="grid-column:6/13;grid-row:span 2;background:#4A4F42;">
    <figcaption class="on-dark"><span class="pl">PL. 07</span><div class="cap">[Caption.]</div></figcaption>
  </figure>
</section>

<section class="contact-sheet wrap">
  <div class="frame">
    <div class="sprocket"></div>
    <div class="contact-strip" id="photo-strip"></div>
    <div class="sprocket"></div>
  </div>
  <div class="contact-foot">Contact sheet — edit <code>content/photos.json</code> to add frames</div>
</section>
